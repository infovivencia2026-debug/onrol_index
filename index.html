<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Server Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070403; --fg:#f3e6da; --or:#ff8a2a; --dim:rgba(255,160,90,.55); --line:rgba(255,140,60,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--fg); font-family:"Roboto Condensed",system-ui,sans-serif; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #scroll { height:1200vh; }
  .ui { position:fixed; pointer-events:none; letter-spacing:.08em; text-transform:uppercase; }
  /* top bar */
  .ticks { top:22px; left:46px; right:46px; height:30px; display:flex; justify-content:space-between; }
  .ticks i { width:1px; height:12px; background:var(--fg); opacity:.6; }
  .tl { top:62px; left:46px; } .tr { top:62px; right:46px; text-align:right; }
  .tl b, .tr b { display:block; font-weight:500; font-size:17px; }
  .tl span, .tr span { font-size:13px; color:var(--dim); }
  .hr { left:0; right:0; height:1px; background:var(--line); }
  /* center label */
  .label { top:18%; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:28px;
    border-left:1px solid var(--line); padding-left:28px; }
  .label b { display:block; font-size:24px; font-weight:500; letter-spacing:.06em; }
  .label span { font-size:12px; color:var(--or); }
  .label button { pointer-events:auto; width:40px; height:40px; border:0; border-radius:3px;
    background:#f3e6da; color:#1a0c04; font-size:20px; cursor:pointer; }
  /* bottom */
  .meta { bottom:178px; left:46px; right:46px; display:flex; justify-content:space-between;
    font-size:13px; color:var(--dim); letter-spacing:.14em; }
  .head { bottom:58px; left:46px; right:46px; font-weight:700; line-height:.98;
    font-size:clamp(28px, 5vw, 64px); letter-spacing:.01em; transition:opacity .4s; }
  .foot { bottom:20px; left:46px; right:46px; display:flex; justify-content:space-between;
    font-size:13px; color:var(--dim); letter-spacing:.18em; border-top:1px solid var(--line); padding-top:12px; }
  .nav { top:50%; right:22px; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
  .nav button { background:none; border:1px solid var(--line); color:var(--dim); font:500 11px "Roboto Condensed";
    letter-spacing:.14em; padding:6px 8px; cursor:pointer; }
  .nav button.on { color:var(--or); border-color:var(--or); box-shadow:0 0 10px rgba(255,138,42,.5); }
  .vignette { inset:0; background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%); }
  @media (max-width:640px) {
    .ticks,.tl,.tr,.meta,.head,.foot { left:16px; right:16px; } .tr { left:auto; }
    .label { top:16%; gap:14px; padding-left:14px; } .meta { bottom:150px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="scroll"></div>
<div class="ui vignette"></div>

<div class="ui ticks"><i></i><i></i><i></i><i></i><i></i></div>
<div class="ui tl"><b>Digital Infrastructure</b><span>AI / Compute Environments</span></div>
<div class="ui tr"><b>Designed for scale</b><span id="clock">2026</span></div>
<div class="ui hr" style="top:122px"></div>

<div class="ui label"><div><b id="dcName">DC—01</b><span id="dcSub">AI Server Hall / 01</span></div>
  <button id="nextBtn" aria-label="Next hall">→</button></div>

<div class="ui meta"><span id="metaL">Neural compute / cloud systems</span><span id="metaR">001—026</span></div>
<div class="ui head" id="head">AI Data Center<br>Infrastructure<br>for the AI Era</div>
<div class="ui foot"><span>Data / Design / Systems</span><span>↑↓ walk · ←→ hall · click rack</span></div>
<div class="ui nav" id="nav"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- 4 halls: 1–3 go straight, then the corridor turns right into hall 4 ----
const HALLS = [
  { id:'DC—01', sub:'AI Server Hall / 01',   meta:'Neural compute / cloud systems',  racks:['GPU-A01','GPU-A02','GPU-A03','GPU-A04','GPU-A05','GPU-A06'] },
  { id:'DC—02', sub:'Storage Vault / 02',    meta:'Distributed storage / data lake', racks:['STR-B01','STR-B02','STR-B03','STR-B04','STR-B05','STR-B06'] },
  { id:'DC—03', sub:'Network Core / 03',     meta:'Fiber backbone / edge routing',   racks:['NET-C01','NET-C02','NET-C03','NET-C04','NET-C05','NET-C06'] },
  { id:'DC—04', sub:'Cooling & Power / 04',  meta:'Thermal systems / grid supply',   racks:['PWR-D01','PWR-D02','PWR-D03','PWR-D04','PWR-D05','PWR-D06'] },
];
const OR = new THREE.Color('#ff8a2a');
const RACK_X = 2.6, RACK_W = 1.4, RACK_H = 3.4, RACK_D = 1.9, HALL_LEN = 26, W = 3.6;
const STRAIGHT = 3;                         // halls before the right turn
const CORNER_Z = -STRAIGHT * HALL_LEN - 2;  // where the turn happens

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#070403');
scene.fog = new THREE.FogExp2('#0d0603', 0.045);
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 200);

const V = (x,y,z) => new THREE.Vector3(x,y,z);
const lineMat = (o) => new THREE.LineBasicMaterial({ color:OR, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false });
const addLine = (parent, pts, o) => parent.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(o)));

// A corridor segment is built in local space running from z=zStart toward -z.
// Segment A (halls 1–3) sits at the origin; segment B (hall 4) is rotated to go right.
const segA = new THREE.Group(); scene.add(segA);
const segB = new THREE.Group(); segB.position.set(0, 0, CORNER_Z); segB.rotation.y = -Math.PI/2; scene.add(segB);

function corridor(g, zStart, zEnd) {
  [-W,-1.8,-0.9,0,0.9,1.8,W].forEach((x) => addLine(g, [V(x,0,zStart), V(x,0,zEnd)], x === 0 ? .25 : .5));
  for (let z = zStart; z > zEnd; z -= 2) addLine(g, [V(-W,0,z), V(W,0,z)], .08);
  [-W, W].forEach((x) => addLine(g, [V(x,RACK_H+0.6,zStart), V(x,RACK_H+0.6,zEnd)], .35));
  const n = Math.floor((zStart - zEnd) * 8), dp = new Float32Array(n*3);
  for (let i = 0; i < n; i++) { dp[i*3] = (Math.random()-.5)*8; dp[i*3+1] = Math.random()*4.5; dp[i*3+2] = zStart - Math.random()*(zStart-zEnd); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  g.add(new THREE.Points(geo, new THREE.PointsMaterial({ color:'#ffb070', size:.03, transparent:true, opacity:.7, blending:THREE.AdditiveBlending })));
}
corridor(segA, 10, CORNER_Z - W);
corridor(segB, W, -HALL_LEN - 12);

// Rack front texture: horizontal server slots + LEDs + id label
function rackTex(id) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 320;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,120,30,0.10)'; g.fillRect(0,0,128,320);
  for (let y = 18; y < 300; y += 7) {
    g.fillStyle = `rgba(255,${130+Math.random()*60|0},60,${0.25+Math.random()*0.5})`;
    g.fillRect(8, y, 112 * (0.5 + Math.random()*0.5), 1.5);
    if (Math.random() < 0.35) { g.fillStyle = '#ffd3a0'; g.fillRect(114, y-1, 3, 3); }
  }
  g.fillStyle = '#ffb070'; g.font = '500 13px "Roboto Condensed", sans-serif'; g.fillText(id, 8, 314);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const clickable = [];
function makeRack(id) {
  const grp = new THREE.Group();
  const geo = new THREE.BoxGeometry(RACK_D, RACK_H, RACK_W);
  grp.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:'#ff7a1a', transparent:true, opacity:.06,
    blending:THREE.AdditiveBlending, depthWrite:false })));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat(.9)));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(RACK_W*0.92, RACK_H*0.95),
    new THREE.MeshBasicMaterial({ map:rackTex(id), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  face.position.x = RACK_D/2 + 0.01; face.rotation.y = Math.PI/2; grp.add(face);
  grp.children.forEach((m) => m.position.y += RACK_H/2);
  face.userData = { id }; clickable.push(face);
  return grp;
}

function buildHall(g, h, z0) {
  const gz = z0 - 1;
  addLine(g, [V(-W,0,gz),V(-W,RACK_H+0.6,gz),V(W,RACK_H+0.6,gz),V(W,0,gz)], .7);
  for (let r = 3; r <= 9; r += 2) {
    const pts = []; for (let a = 0; a <= 64; a++) { const t = a/64*Math.PI*2; pts.push(V(Math.cos(t)*r, 2 + Math.sin(t)*r, gz)); }
    addLine(g, pts, .12);
  }
  h.racks.forEach((id, j) => {
    [-1, 1].forEach((side) => {
      const r = makeRack(side < 0 ? id : id.replace(/\d+$/, (n) => String(+n + 6).padStart(2,'0')));
      r.position.set(side * (RACK_X + RACK_D/2), 0, z0 - 4 - j * (RACK_W + 0.25));
      r.rotation.y = side < 0 ? 0 : Math.PI;   // front faces the aisle
      g.add(r);
    });
  });
}
HALLS.forEach((h, i) => { if (i < STRAIGHT) buildHall(segA, h, -i * HALL_LEN); else buildHall(segB, h, -(i - STRAIGHT) * HALL_LEN - 2); });

// Corner: a wall of racks straight ahead, with a glowing arrow pointing right
const cornerWall = new THREE.Group(); cornerWall.position.set(0, 0, CORNER_Z - W - RACK_D/2); scene.add(cornerWall);
for (let k = -2; k <= 2; k++) { const r = makeRack('TURN-' + (k+3)); r.rotation.y = -Math.PI/2; r.position.x = k * (RACK_W + 0.2); cornerWall.add(r); }
const arrowPts = [V(-1.2,2.0,0.1),V(0.6,2.0,0.1),V(0.6,2.5,0.1),V(1.5,1.7,0.1),V(0.6,0.9,0.1),V(0.6,1.4,0.1),V(-1.2,1.4,0.1),V(-1.2,2.0,0.1)];
const arrow = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arrowPts), new THREE.LineBasicMaterial({ color:'#ffd0a0' }));
arrow.position.set(0, 0.6, RACK_D/2 + 0.05); cornerWall.add(arrow);

// End-of-corridor glowing door (end of hall 4)
const endZ = -HALL_LEN - 10;
addLine(segB, [V(-1.4,0,endZ),V(-1.4,2.6,endZ),V(1.4,2.6,endZ),V(1.4,0,endZ),V(-1.4,0,endZ)], 1);
const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.6),
  new THREE.MeshBasicMaterial({ color:'#ff7a1a', transparent:true, opacity:.5, blending:THREE.AdditiveBlending }));
glow.position.set(0, 1.3, endZ - 0.01); segB.add(glow);
const halo = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshBasicMaterial({ color:'#ff6a10', transparent:true,
  opacity:.12, blending:THREE.AdditiveBlending, depthWrite:false }));
halo.position.set(0, 1.5, endZ - 0.5); segB.add(halo);

// glow
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1,1), 1.1, 0.6, 0.15));
composer.addPass(new OutputPass());

// ---- Walking path: straight, smooth right turn, straight ----
const Y = 1.7, R = 2.5;
const path = new THREE.CurvePath();
path.add(new THREE.LineCurve3(V(0,Y,7), V(0,Y,CORNER_Z + R)));
path.add(new THREE.QuadraticBezierCurve3(V(0,Y,CORNER_Z + R), V(0,Y,CORNER_Z), V(R,Y,CORNER_Z)));
path.add(new THREE.LineCurve3(V(R,Y,CORNER_Z), V(HALL_LEN + 4,Y,CORNER_Z)));
const PATH_LEN = path.getLength();
// distance along the path where each hall starts
const hallStart = HALLS.map((h, i) => i < STRAIGHT ? i * HALL_LEN + 4 : PATH_LEN - HALL_LEN);

const scrollMax = () => document.documentElement.scrollHeight - innerHeight;
let u = 0, focus = null;
const camPos = path.getPointAt(0), camLook = V(0, 1.55, -1);
const hallOf = () => { const d = u * PATH_LEN; let h = 0; hallStart.forEach((s, i) => { if (d >= s - 2) h = i; }); return h; };
const goHall = (i) => { focus = null; scrollTo({ top: scrollMax() * Math.max(0, hallStart[i] - 3) / PATH_LEN + 1, behavior:'smooth' }); };

const nav = document.getElementById('nav');
HALLS.forEach((h, i) => { const b = document.createElement('button'); b.textContent = h.id; b.onclick = () => goHall(i); nav.appendChild(b); });
document.getElementById('nextBtn').onclick = () => goHall((hallOf() + 1) % HALLS.length);

addEventListener('keydown', (e) => {
  const step = scrollMax() / PATH_LEN * 3;
  if (e.key === 'Escape') focus = null;
  else if (e.key === 'ArrowUp')    { e.preventDefault(); scrollBy({ top:  step, behavior:'smooth' }); }
  else if (e.key === 'ArrowDown')  { e.preventDefault(); scrollBy({ top: -step, behavior:'smooth' }); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goHall(Math.min(HALLS.length - 1, hallOf() + 1)); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); goHall(Math.max(0, hallOf() - 1)); }
});
addEventListener('scroll', () => { focus = null; });
canvas.addEventListener('click', (e) => {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects(clickable)[0];
  focus = hit ? hit.object : null;
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const $ = (id) => document.getElementById(id);
const clock = new THREE.Clock(), tmp = V(0,0,0), q = new THREE.Quaternion();
let lastHall = -1;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const p = scrollMax() > 0 ? Math.min(1, scrollY / scrollMax()) : 0;
  u += (p - u) * (1 - Math.exp(-dt * 4));
  const k = 1 - Math.exp(-dt * 6);
  if (focus) {
    focus.getWorldPosition(tmp);
    const n = V(0,0,1).applyQuaternion(focus.getWorldQuaternion(q));
    camPos.lerp(tmp.clone().addScaledVector(n, 2.4).setY(1.8), k * .5);
    camLook.lerp(tmp, k * .5);
  } else {
    const pos = path.getPointAt(u);
    // look ahead along the path so the camera turns into the corner smoothly
    const ahead = path.getPointAt(Math.min(1, u + 6 / PATH_LEN));
    if (u > 1 - 6 / PATH_LEN) ahead.add(path.getTangentAt(1).multiplyScalar(6));
    camPos.lerp(pos.add(V(Math.sin(t*.4)*.08, 0, 0)), k);
    camLook.lerp(ahead.setY(1.55), k);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);
  glow.material.opacity = .45 + Math.sin(t*2)*.08;
  arrow.material.color.setScalar(0.7 + Math.sin(t*4)*0.3).multiply(new THREE.Color('#ffd0a0'));

  const hi = hallOf();
  if (hi !== lastHall) {
    lastHall = hi; const h = HALLS[hi];
    $('dcName').textContent = h.id; $('dcSub').textContent = h.sub; $('metaL').textContent = h.meta;
    $('metaR').textContent = String(hi*6+1).padStart(3,'0') + '—' + String(hi*6+6).padStart(3,'0');
    [...nav.children].forEach((b, i) => b.classList.toggle('on', i === hi));
  }
  $('head').style.opacity = focus ? 0 : Math.max(0.15, 1 - p * 6);
  if (focus) $('dcSub').textContent = 'Rack / ' + focus.userData.id;
  else if ($('dcSub').textContent.startsWith('Rack')) $('dcSub').textContent = HALLS[hi].sub;
  composer.render();
});
</script>
</body>
</html>
